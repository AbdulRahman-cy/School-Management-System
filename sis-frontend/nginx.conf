# nginx.conf — production reverse proxy + static file server for
# Ibn al-Haytham. Listens on port 80 (plain HTTP) until a TLS cert exists —
# no `listen 443` block yet, that's a later step.
#
# Swap your-domain.com for the EC2 public IP while testing — a
# server_name of the literal IP works fine for plain HTTP before you have
# a domain or a cert.

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    client_max_body_size 20M;

    # ── React build — served directly, no proxy hop ─────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;   # lets React Router handle client-side routes
    }

    # ── Django static (admin CSS/JS, drf-spectacular docs UI) ───────────
    # Populated by `python manage.py collectstatic` inside the backend
    # container. Reachable here because both containers mount the same
    # `static_volume` / `media_volume` Docker volumes.
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # ── Everything API-shaped goes to Django ─────────────────────────────
    # `web` is the Docker Compose service name for the Django container,
    # resolved via Docker's internal DNS.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}