  /api/records/assignments/:
    get:
      operationId: records_assignments_list
      parameters:
      - in: query
        name: assignment_type
        schema:
          type: string
          enum:
          - ESSAY
          - HOMEWORK
          - PROJECT
        description: |-
          * `HOMEWORK` - Homework
          * `PROJECT` - Project
          * `ESSAY` - Essay
      - in: query
        name: course_class
