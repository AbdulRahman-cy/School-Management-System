components:
  schemas:
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course_class:
          type: integer
        course_code:
          type: string
          readOnly: true
        course_title:
          type: string
          readOnly: true
        assignment_type:
          $ref: '#/components/schemas/AssignmentTypeEnum'
        due_week:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Week number within the term by which the assignment is due
            (1-based).
        max_points:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assignment_type
      - course_class
      - course_code
      - course_title
      - created_at
      - due_week
      - id
      - max_points
      - updated_at
    AssignmentTypeEnum:
      enum:
      - HOMEWORK
      - PROJECT
      - ESSAY
      type: string
      description: |-
        * `HOMEWORK` - Homework
        * `PROJECT` - Project
        * `ESSAY` - Essay
    AttendanceRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        session:
          type: integer
        term_name:
          type: string
          readOnly: true
        course_code:
          type: string
          readOnly: true
        course_title:
          type: string
          readOnly: true
        session_type:
          type: string
          readOnly: true
        week:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Week number within the term (1-based).
        status:
          $ref: '#/components/schemas/AttendanceRecordStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course_code
      - course_title
      - created_at
      - id
      - session
      - session_type
      - status
      - student
      - term_name
      - updated_at
      - week
    AttendanceRecordStatusEnum:
      enum:
      - PRESENT
      - ABSENT
      - LATE
      - EXCUSED
      type: string
      description: |-
        * `PRESENT` - Present
        * `ABSENT` - Absent
        * `LATE` - Late
        * `EXCUSED` - Excused
    BaseUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - first_name
      - id
      - last_name
      - role
      - updated_at
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 20
        title:
          type: string
          maxLength: 200
        credits:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        course_type:
          $ref: '#/components/schemas/CourseTypeEnum'
        department:
          allOf:
          - $ref: '#/components/schemas/Department'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - credits
      - department
      - id
      - title
      - updated_at
    CourseClass:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          allOf:
          - $ref: '#/components/schemas/Course'
          readOnly: true
        term:
          allOf:
          - $ref: '#/components/schemas/Term'
          readOnly: true
        group:
          allOf:
          - $ref: '#/components/schemas/StudyGroup'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - created_at
      - group
      - id
      - term
      - updated_at
    CourseTypeEnum:
      enum:
      - CORE
      - ELECTIVE
      type: string
      description: |-
        * `CORE` - Core
        * `ELECTIVE` - Elective
    CustomTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    DayEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      type: integer
      description: |-
        * `0` - Saturday
        * `1` - Sunday
        * `2` - Monday
        * `3` - Tuesday
        * `4` - Wednesday
        * `5` - Thursday
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 10
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    Discipline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 20
        department:
          allOf:
          - $ref: '#/components/schemas/Department'
          readOnly: true
        program_type:
          $ref: '#/components/schemas/ProgramTypeEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - department
      - id
      - name
      - program_type
      - updated_at
    Enrollment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        course_class:
          allOf:
          - $ref: '#/components/schemas/CourseClass'
          readOnly: true
        lecture_session:
          type: integer
          nullable: true
        tutorial_session:
          type: integer
          nullable: true
        lab_session:
          type: integer
          nullable: true
        grades:
          type: array
          items:
            $ref: '#/components/schemas/GradeEntry'
          readOnly: true
        final_percentage:
          type: string
          readOnly: true
        course_grade_points:
          type: string
          readOnly: true
        cohort_stats:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - cohort_stats
      - course_class
      - course_grade_points
      - created_at
      - final_percentage
      - grades
      - id
      - student
      - updated_at
    Exam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course_class:
          type: integer
        course_code:
          type: string
          readOnly: true
        course_title:
          type: string
          readOnly: true
        exam_type:
          $ref: '#/components/schemas/ExamTypeEnum'
        week:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Week number within the term when the exam is held (1-based).
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Maximum achievable score, e.g. 30.00 for a midterm worth 30
            marks.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course_class
      - course_code
      - course_title
      - created_at
      - exam_type
      - id
      - max_score
      - updated_at
      - week
    ExamResult:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        exam:
          type: integer
        student:
          type: integer
        course_code:
          type: string
          readOnly: true
        course_title:
          type: string
          readOnly: true
        exam_type:
          type: string
          readOnly: true
        exam_week:
          type: integer
          readOnly: true
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        status:
          $ref: '#/components/schemas/ExamResultStatusEnum'
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course_code
      - course_title
      - created_at
      - exam
      - exam_type
      - exam_week
      - id
      - max_score
      - student
      - updated_at
    ExamResultStatusEnum:
      enum:
      - PRESENT
      - ABSENT
      - EXCUSED
      - CHEATING
      type: string
      description: |-
        * `PRESENT` - Present
        * `ABSENT` - Absent
        * `EXCUSED` - Excused
        * `CHEATING` - Disqualified
    ExamTypeEnum:
      enum:
      - MIDTERM
      - FINAL
      - PRACTICAL
      - QUIZ
      type: string
      description: |-
        * `MIDTERM` - Midterm Exam
        * `FINAL` - Final Exam
        * `PRACTICAL` - Practical/Lab Exam
        * `QUIZ` - Quiz
    GradeEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        enrollment:
          type: integer
        component:
          type: string
          description: e.g. 'Midterm Exam', 'Final Exam', 'Quiz 1', 'Homework'
          maxLength: 100
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Raw score on this component's scale (not out of 100).
        created_at:
          type: string
          format: date-time
